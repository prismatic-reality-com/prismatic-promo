name: Deploy to GitHub Pages

# Pure static site (Zola SSG) with Tailwind + Flowbite + Alpine + Chart.js + p5 + three.js.
# Libraries load on-demand from CDN in templates/base.html (no node build).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Zola)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          zola build --base-url "${BASE_URL}" --output-dir public

      - name: Post-build glossary-hover guard
        run: |
          find public -name '*.html' -print0 | xargs -0 perl -i -pe "s{const link = e\.target\.closest}{const el = e.target.nodeType === 1 ? e.target : e.target.parentElement; const link = el \&\& el.closest}g"

      - name: Guard against Jekyll processing
        run: touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
