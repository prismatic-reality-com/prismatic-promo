// ====================== HELPERS (DOM-only, no innerHTML) ======================
function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs){
    for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='onclick') e.addEventListener('click', attrs[k]);
      else if(k.startsWith('data-')) e.setAttribute(k, attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
  }
  for(const c of children){
    if(c==null) continue;
    if(Array.isArray(c)){
      for(const x of c){ if(x==null) continue; e.appendChild(typeof x==='string' || typeof x==='number' ? document.createTextNode(String(x)) : x); }
    } else if(typeof c==='string' || typeof c==='number'){
      e.appendChild(document.createTextNode(String(c)));
    } else {
      e.appendChild(c);
    }
  }
  return e;
}

function clearChildren(node){
  while(node.firstChild){ node.removeChild(node.firstChild); }
}

function parseHash(){
  const h = window.location.hash.replace(/^#/,'');
  if(!h || h==='/' || h===''){return {route:'home'};}
  const parts = h.split('/').filter(Boolean);
  if(parts.length===2){return {route:'detail', kind:parts[0], slug:parts[1]};}
  return {route:'home'};
}

function navigate(hash){
  if(window.location.hash !== hash){window.location.hash = hash;}
  else { render(); }
}

window.addEventListener('hashchange', render);
window.addEventListener('popstate', render);

// Linkify entity mentions in text content using DOM-only construction
function linkifyText(text, currentSlug){
  if(!text) return document.createTextNode('');
  const wrap = el('span');
  const aliases = [];
  for(const slug in ENTITIES){
    if(slug===currentSlug) continue;
    const e = ENTITIES[slug];
    aliases.push({slug, name:e.name, type:e.type});
    const parts = e.name.split(' ');
    if(e.name.includes('Kellnerová') && slug!=='kellner-family-foundation' && parts.length>=2){
      aliases.push({slug, name:parts[0]+' '+parts[1], type:e.type});
    }
  }
  aliases.sort((a,b)=>b.name.length-a.name.length);

  let remaining = text;
  let safety = 0;
  while(remaining.length>0 && safety++<200){
    let bestIdx = -1, bestAlias = null;
    for(const al of aliases){
      const idx = remaining.indexOf(al.name);
      if(idx!==-1 && (bestIdx===-1 || idx<bestIdx)){
        bestIdx = idx; bestAlias = al;
      }
    }
    if(bestIdx===-1){ wrap.appendChild(document.createTextNode(remaining)); break; }
    if(bestIdx>0){ wrap.appendChild(document.createTextNode(remaining.slice(0,bestIdx))); }
    const kind = bestAlias.type==='person' ? 'person' : 'company';
    wrap.appendChild(el('a', {href:`#/${kind}/${bestAlias.slug}`}, bestAlias.name));
    remaining = remaining.slice(bestIdx + bestAlias.name.length);
  }
  return wrap;
}

function severityClass(sev){
  if(!sev) return 'pill-info';
  const s = sev.toLowerCase();
  if(s.includes('high') || s==='high') return 'pill-risk-high';
  if(s.includes('med') || s==='med' || s==='medium') return 'pill-risk-med';
  if(s.includes('low') || s==='low') return 'pill-risk-low';
  return 'pill-info';
}

function setBreadcrumb(items){
  const bc = document.getElementById('breadcrumb');
  clearChildren(bc);
  items.forEach((item, i)=>{
    if(i>0){ bc.appendChild(el('span', {}, ' › ')); }
    if(item.href){ bc.appendChild(el('a', {href:item.href}, item.label)); }
    else { bc.appendChild(el('span', {class:'text-white'}, item.label)); }
  });
}

// ====================== HOME RENDER ======================
function renderHome(){
  const root = document.getElementById('app-root');
  clearChildren(root);
  setBreadcrumb([{label:'Home', href:'#/'}]);

  const intro = el('div', {class:'mb-6'},
    el('h2', {class:'text-2xl font-bold text-white mb-2'}, 'Kellner Cluster — 15 entit'),
    el('p', {class:'text-sm text-[#9eb1d6] max-w-3xl'}, 'AMALAR superholding cluster: 4 osoby + 10 firem + 1 nadace. Konsolidace majetku rodiny Kellnerových po smrti Petra Kellnera (†2021). Sídlo: Evropská 2690/17, Praha 6. Klikem na kartu otevřete detailní profil.')
  );
  root.appendChild(intro);

  const grid = el('div', {class:'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4', id:'entity-grid'});
  root.appendChild(grid);

  for(const slug in ENTITIES){
    const e = ENTITIES[slug];
    const kind = e.type==='person' ? 'person' : 'company';
    const pillClass = e.type==='person'?'pill-person':e.type==='foundation'?'pill-foundation':'pill-company';
    const pillLabel = e.type==='person'?'Osoba':e.type==='foundation'?'Nadace':'Firma';
    const searchStr = ((e.name||'')+' '+(e.ico||'')+' '+(e.cak||'')+' '+(e.fei_id||'')).toLowerCase();
    const desc = (e.role||'').slice(0,140) + ((e.role||'').length>140 ? '...' : '');

    const headerLeft = e.type==='person'
      ? el('div', {class:'w-12 h-12 rounded-full bg-gradient-to-br from-[#3b82f6] to-[#1e3a8a] flex items-center justify-center text-white font-bold text-lg'}, e.monogram||'?')
      : el('div', {class:'badge-ico'}, 'IČO '+(e.ico||'—'));

    const card = el('div', {class:'card p-5 cursor-pointer transition-all', 'data-type':e.type, 'data-search':searchStr, onclick:()=>navigate(`#/${kind}/${slug}`)},
      el('div', {class:'flex items-start justify-between mb-3'},
        headerLeft,
        el('span', {class:'pill '+pillClass}, pillLabel)
      ),
      el('h3', {class:'text-base font-bold text-white mb-1'}, e.name),
      el('p', {class:'text-xs text-[#9eb1d6]'}, desc),
      el('div', {class:'mt-3 pt-3 border-t border-[#1f2a44] text-xs text-[#7d8db1]'},
        e.type==='person'
          ? 'DOB: '+(e.dob||'—')
          : 'Založeno: '+(e.incorporated||'—')+' · Kapitál: '+(e.capital||'—')
      )
    );
    grid.appendChild(card);
  }

  applyFilter();
  applySearch();
}

function renderDetail(kind, slug){
  const e = ENTITIES[slug];
  if(!e){ navigate('#/'); return; }
  const root = document.getElementById('app-root');
  clearChildren(root);

  const typeLabel = e.type==='person' ? 'Osoby' : e.type==='foundation' ? 'Nadace' : 'Firmy';
  setBreadcrumb([
    {label:'Home', href:'#/'},
    {label:typeLabel, href:'#/'},
    {label:e.name}
  ]);

  // Header card
  const pillClass = e.type==='person'?'pill-person':e.type==='foundation'?'pill-foundation':'pill-company';
  const headerLeft = e.type==='person'
    ? el('div', {class:'w-16 h-16 rounded-full bg-gradient-to-br from-[#3b82f6] to-[#1e3a8a] flex items-center justify-center text-white font-bold text-2xl'}, e.monogram||'?')
    : el('div', {class:'w-16 h-16 rounded-lg bg-gradient-to-br from-[#10b981] to-[#065f46] flex items-center justify-center text-white font-bold text-xs px-2 text-center'}, e.ico||'—');

  const headerBadges = [];
  headerBadges.push(el('span', {class:'pill '+pillClass}, e.type==='person'?'Osoba':e.type==='foundation'?'Nadace':'Firma'));
  if(e.dob) headerBadges.push(el('span', {class:'text-xs text-[#9eb1d6]'}, '* '+e.dob));
  if(e.incorporated) headerBadges.push(el('span', {class:'text-xs text-[#9eb1d6]'}, 'Založeno: '+e.incorporated));

// ====================== THREE.JS EGO ======================
let _threeAnimId = null;
function initEgoNetwork(slug){
  const container = document.getElementById('ego-canvas');
  if(!container || !window.THREE) return;
  if(_threeAnimId){ cancelAnimationFrame(_threeAnimId); _threeAnimId=null; }
  clearChildren(container);

  const w = container.clientWidth, h = container.clientHeight || 340;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070b18);
  const camera = new THREE.PerspectiveCamera(60, w/h, 0.1, 1000);
  camera.position.set(0, 0, 12);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const center = ENTITIES[slug];
  const centerColor = center.type==='person' ? 0x3b82f6 : center.type==='foundation' ? 0xf59e0b : 0x10b981;
  const centerSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 24, 24),
    new THREE.MeshBasicMaterial({color: centerColor})
  );
  scene.add(centerSphere);

  const rels = (center.relations||[]);
  const radius = 5;
  const nodes = [];
  rels.forEach((r,i)=>{
    const target = ENTITIES[r.to];
    if(!target) return;
    const phi = Math.acos(-1 + (2*i)/Math.max(rels.length,1));
    const theta = Math.sqrt(Math.max(rels.length,1) * Math.PI) * phi;
    const x = radius*Math.cos(theta)*Math.sin(phi);
    const y = radius*Math.sin(theta)*Math.sin(phi);
    const z = radius*Math.cos(phi);
    const color = target.type==='person'?0x3b82f6:target.type==='foundation'?0xf59e0b:0x10b981;
    const node = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 18, 18),
      new THREE.MeshBasicMaterial({color})
    );
    node.position.set(x,y,z);
    scene.add(node);
    nodes.push({mesh:node, slug:r.to, target_type:r.target_type});

    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(x,y,z)]);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color:0x3b5377, transparent:true, opacity:0.7}));
    scene.add(line);
  });

  let controls = null;
  if(window.THREE && THREE.OrbitControls){
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
  }

  let rotY = 0;
  function animate(){
    _threeAnimId = requestAnimationFrame(animate);
    if(!controls){ rotY += 0.003; scene.rotation.y = rotY; }
    if(controls) controls.update();
    renderer.render(scene, camera);
  }
  animate();

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('click', (ev)=>{
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((ev.clientX-rect.left)/rect.width)*2 - 1;
    mouse.y = -((ev.clientY-rect.top)/rect.height)*2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(nodes.map(n=>n.mesh));
    if(intersects.length>0){
      const found = nodes.find(n=>n.mesh===intersects[0].object);
      if(found){
        const kind = found.target_type==='person'?'person':'company';
        navigate(`#/${kind}/${found.slug}`);
      }
    }
  });
}

// ====================== P5 PULSE ======================
let _p5Inst = null;
function initP5Pulse(slug){
  if(_p5Inst){ try{_p5Inst.remove();}catch(_e){} _p5Inst=null; }
  const container = document.getElementById('p5-canvas');
  if(!container || !window.p5) return;

  const e = ENTITIES[slug];
  const events = [];
  if(e.dob && e.dob!=='nezveřejněno') events.push({date:e.dob, label:'Narození'});
  if(e.incorporated) events.push({date:e.incorporated, label:'Založení'});
  if(e.rebrand) events.push({date:e.rebrand.split(' ')[0], label:'Rebrand'});
  Object.keys(TIMELINE_MILESTONES).forEach(k=>{
    if(k.match(/\d{4}/)) events.push({date:k, label:TIMELINE_MILESTONES[k]});
  });

  const sketch = (p)=>{
    let t = 0;
    p.setup = ()=>{
      const c = p.createCanvas(container.clientWidth, container.clientHeight||120);
      c.parent(container);
    };
    p.draw = ()=>{
      p.background(7,11,24);
      const w = p.width, h = p.height;
      p.stroke(58,82,135); p.strokeWeight(1);
      p.line(20, h/2, w-20, h/2);
      events.forEach((ev,i)=>{
        const yearMatch = ev.date.match(/(\d{4})/);
        if(!yearMatch) return;
        const year = parseInt(yearMatch[1]);
        const x = p.map(year, 1995, 2026, 30, w-30);
        const pulse = p.sin(t*0.05 + i)*3 + 6;
        p.noStroke();
        p.fill(108,177,255, 200);
        p.circle(x, h/2, pulse*2);
        p.fill(154,180,214);
        p.textSize(8);
        p.textAlign(p.CENTER);
        p.text(year, x, h/2 + 22);
      });
      t++;
    };
    p.windowResized = ()=>{ p.resizeCanvas(container.clientWidth, container.clientHeight||120); };
  };
  _p5Inst = new p5(sketch);
}

// ====================== FILTER & SEARCH ======================
let activeFilter = 'all';
let activeSearch = '';

function applyFilter(){
  document.querySelectorAll('#entity-grid > div').forEach(card=>{
    const t = card.getAttribute('data-type');
    if(activeFilter==='all' || t===activeFilter){ card.style.display=''; }
    else { card.style.display='none'; }
  });
}
function applySearch(){
  if(!activeSearch){
    document.querySelectorAll('#entity-grid > div').forEach(c=>{
      const t = c.getAttribute('data-type');
      if(activeFilter==='all' || t===activeFilter){ c.style.display=''; }
    });
    return;
  }
  document.querySelectorAll('#entity-grid > div').forEach(card=>{
    const s = card.getAttribute('data-search')||'';
    const t = card.getAttribute('data-type');
    const filterMatch = (activeFilter==='all' || t===activeFilter);
    const searchMatch = s.includes(activeSearch.toLowerCase());
    card.style.display = (filterMatch && searchMatch) ? '' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('search').addEventListener('input', (ev)=>{
    activeSearch = ev.target.value.trim();
    if(window.location.hash==='' || window.location.hash==='#/' ){
      applyFilter(); applySearch();
    } else {
      navigate('#/');
      setTimeout(()=>{applyFilter(); applySearch();}, 80);
    }
  });
  document.querySelectorAll('#filter-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#filter-chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.getAttribute('data-filter');
      if(window.location.hash==='' || window.location.hash==='#/' ){
        applyFilter(); applySearch();
      } else {
        navigate('#/');
        setTimeout(()=>{applyFilter(); applySearch();}, 80);
      }
    });
  });
  render();
});

function render(){
  const r = parseHash();
  if(r.route==='home'){ renderHome(); }
  else if(r.route==='detail'){ renderDetail(r.kind, r.slug); }
  else { renderHome(); }
  window.scrollTo({top:0, behavior:'instant'});
}
